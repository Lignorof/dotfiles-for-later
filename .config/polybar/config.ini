[colors]

; turquesa 		#008080
; turquesa claro 	#00a0a0
; branco 		#fff 
; cinza 		#222222

background = 		#222222
background-alt = 	#00b0b0
foreground = 		#fff
accent-color = 		#008080


[bar/mybar]
bottom = false

modules-left = ewmh xwindow
modules-center = date
modules-right = xkeyboard
font-0 = Hack:size=10

tray-position = right
tray-padding = 1 

background = ${colors.background}
background-alt = ${colors.background-alt}

padding-right = 1

module-margin-left = 1
module-margin-right = 1


[module/xwindow]
type = internal/xwindow

; Available tags:
;   <label> (default)
format = <label>
format-background = ${colors.accent-color}
format-foreground = #fff
format-padding = 2

; Available tokens:
;   %title%
; Default: %title%
label = %title%
label-maxlen = 50

; Used instead of label when there is no window title
; Available tokens:
;   None
label-empty = 
label-empty-foreground = ${colors.accent-color}

[module/date]
type = internal/date
date = %d/%m/%Y %H:%M:%S%

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
label-layout = %layout%

labe-indicator-background = ${colors.accent-color}


[module/pulseaudio]
type = internal/pulseaudio

format = <label-volume>
label-volume = VOL %percentage%%

label-muted = 🔇 muted


[module/ewmh]
type = internal/xworkspaces

pin-workspaces = true
enable-click = true
enable-scroll = false


label-active-padding = 1
label-active = %index% 
label-active-background = ${colors.accent-color}


label-occupied-padding = 1
label-occupied = %index% 


label-empty-padding = 1
label-empty =  %index%

icon-0 = Área 1;1
icon-1 = Área 2;2
icon-2 = Área 3;3
icon-3 = Área 4;4
;icon-4 = bagunça;5
icon-default = 0 

format = <label-state> 


[module/wlan]
type = internal/network
interface = wlp59s0
interval = 3.0

format-connected = <ramp-signal> <label-connected>
format-connected-underline = #9f78e1
label-connected = %essid%

format-disconnected =
;format-disconnected = <label-disconnected>
;format-disconnected-underline = ${self.format-connected-underline}
;label-disconnected = %ifname% disconnected
;label-disconnected-foreground = ${colors.foreground-alt}

ramp-signal-0 = 
ramp-signal-1 = 
ramp-signal-2 = 
ramp-signal-3 = 
ramp-signal-4 = 
ramp-signal-foreground = ${colors.accent-color}

