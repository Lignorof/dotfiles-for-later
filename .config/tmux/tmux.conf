# Tmux config, i hope it doesn't overrite normal cfg

# add prefix to 'C-a'
#unbind C-b
#set-option -g prefix C-a
#bind-key C-a send-prefix

#unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind C-b send-prefix

# split panes using | and -
#bind | split-window -h
#bind - split-window -v

# Open panes in current directory
bind '"' split-window -h -c "#{pane_current_path}"
bind '%' split-window -v -c "#{pane_current_path}"
bind '\' split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"

# Enable mouse mode (tmux 2.1 and above)
set -g mouse on

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on



# Tmux Resurrect for neovim
  set -g @resurrect-strategy-nvim 'session'

# bottom of the file:

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-yank'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'

# micro tutorials:
# Plugins: prefix + I (capital) to fetch plugins and source it
# Resurrect: prefix + S - Save
# prefix + R - restore

# To add new programs to be restored, read the docs at 
# https://github.com/tmux-plugins/tmux-resurrect/blob/master/docs/restoring_programs.md
